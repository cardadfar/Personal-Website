<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Contact | Oscar Dadfar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The portfolio of Oscar Dadfar.">
    <link rel="stylesheet" type="text/css" href="style.css?v=20260920b">
    <link rel="stylesheet" type="text/css" href="contact-style.css?v=20260920b">
    <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</head>
<body>
    <div class="rectangle01"></div>
    <p class="center">Contact</p>
    <div class="rectangle02"></div>
    <div class="nav">
        <div class="tab" id="home-icon">
            <a href="index">Home</a>
            <img class="top-icon" src="assets/home-icon.png">
              <p class="tab-box" id="tab-box1">Introduction • Resume • Coursework</p>
        </div>
        <div class="small-rectangle"></div>
        <div class="tab" id="skills-icon">
            <a href="skills">Skills</a>
            <img class="top-icon" src="assets/skills-icon.png">
            <p class="tab-box" id="tab-box2">Software • Programming</p>
        </div>
        <div class="small-rectangle"></div>
        <div class="tab" id="projects-icon">
            <a href="projects">Projects</a>
            <img class="top-icon" src="assets/projects-icon.png">
              <p class="tab-box" id="tab-box3">Portfolio Content</p>
        </div>
        <div class="small-rectangle"></div>
        <div class="tab" id="experience-icon">
            <a href="experience">Experience</a>
            <img class="top-icon" src="assets/experience-icon.png">
              <p class="tab-box" id="tab-box4">Education • Work</p>
        </div> 
        <div class="small-rectangle"></div>
        <div class="tab" id="contact-icon">
            <a href="contact">Contact</a>
            <img class="top-icon" src="assets/contact-icon.png">
              <p class="tab-box" id="tab-box5">Get In Touch</p>
        </div>
    </div>
    <div class="bridge"><img src="assets/tab-backgrounds/home-blur.jpg" style="height: 100vh;"></div>
    <div class="body-background">
        <p class="hi" id="start-text">Contact.</p>
        <p class="indent intro-line">You can get in touch with me at any time.</p>
        <p class="indent intro-line">Send a message below, or find me on the links underneath.</p>

        <form class="contact-form" id="contact-form" action="https://formspree.io/f/xoevjjzg" method="POST" novalidate>
            <div class="contact-row">
                <label class="contact-field">
                    <span>Name</span>
                    <input type="text" name="name" autocomplete="name" required>
                </label>
                <label class="contact-field">
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>
            </div>
            <label class="contact-field">
                <span>Message</span>
                <textarea name="message" rows="6" required></textarea>
            </label>
            <input type="text" name="_gotcha" class="contact-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
            <input type="hidden" name="_subject" value="New message from cardadfar.com">
            <div class="contact-actions">
                <button class="contact-submit" type="submit">
                    <span class="resume-line"></span>
                    <span class="contact-submit-label">Send Message</span>
                    <span class="resume-line"></span>
                </button>
                <p class="contact-status" role="status" aria-live="polite"></p>
            </div>
        </form>

        <div class="nav-bottom">
            <div class="bottom-tab" id="linkedin-icon">
                <img src="assets/linkedin-icon.png">
            </div>
            <div class="bottom-tab" id="vimeo-icon">
                <img src="assets/vimeo-icon.png">
            </div>
            <div class="bottom-tab" id="git-icon">
                <img src="assets/git-icon.png">
            </div>
        </div>

    </div>
    <script type="text/javascript" src="interactions.js?v=20260920b"></script>
</body>
</html>
